# Third-party sample images used by tests/corpus.rs. They are NOT committed:
# `cargo xtask fixtures` downloads them, pinned by commit and checked by SHA-256,
# into tests/fixtures/external/ (gitignored). See docs/roadmap.md#testing.
#
# Licensing: these files are not redistributed by this repository. Their
# licenses vary per file; see each source's own notes.
#
# Privacy: tests/golden/ holds ExifTool's output for these files unmodified,
# including any GPS coordinates. That is deliberate: every file is already
# public at the pinned URL below, and the goldens must stay plain ExifTool
# output so mismatches are readable. To keep a file's metadata out of the
# repository, remove the file from this list instead of redacting its golden.

[[source]]
name = "exif-py"
url = "https://raw.githubusercontent.com/ianare/exif-py/8f6efb2c6e2ed3481ba5d0c5c10c87097de9e9a1/"
notes = "BSD-3-Clause repository. Images: Wikimedia Commons (per-file licenses, see tests/resources/jpg/README.txt), exif.org samples, spatialite GPS samples, contributions under CC BY-SA 4.0."

[[source]]
name = "exiftool"
url = "https://raw.githubusercontent.com/exiftool/exiftool/1da714924f67763b6a8a7013dd2aa1983a16f87b/"
notes = "GPL-3.0 repository (ExifTool's own test images). Small stripped raw and TIFF samples: Panasonic RW2, Canon CR2, Nikon NEF, DNG."

