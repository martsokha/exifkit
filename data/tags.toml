# Tag table: the source of truth for `src/tag/generated.rs` and `src/tag/enums.rs`.
# Regenerate with `cargo xtask codegen`. CI runs `cargo xtask codegen --check`.
# Schema and conventions: docs/format.md §6 and docs/architecture.md#tag-table.
#
# [[enum]] fields:
#   name      Rust type name.
#   values    { value, variant, desc }. Every enum also gets `Other(u16)` for
#             values the spec does not define, so `variant = "Other"` is reserved.
#
# [[tag]] fields (defaults in brackets):
#   name      CIPA spec name (TIFF name for TIFF tags).
#   alias     ExifTool name, when different.
#   const     Override for the generated constant name.
#   id        Tag id.
#   ns        main | gps | interop                                     [main]
#   ifd       primary | thumbnail | exif | gps | interop               [from ns: primary/gps/interop]
#   types     Allowed field types, preferred first: byte ascii short long rational
#             sbyte undefined sshort slong srational float double ifd utf8
#   count     An integer, "any", or a list of allowed counts. Strings count the NUL.
#   role      value | pointer | data-offset | data-length | maker-note | computed  [value]
#   target    For role = "pointer": exif | gps | interop | sub-ifd
#   origin    tiff | tiff-ep | exif | dng | adobe | microsoft | other  [exif]
#   since     Exif version that introduced the tag, recorded for 2.3 and later.
#   enum      Name of an [[enum]] the value is drawn from.
#   personal  Can identify a person; removed by `Strip::Personal`.   [false]
#   verified  false while a row still has to be checked against the CIPA PDF.  [true]
#
# Exif rows are checked against CIPA DC-008-2026 (Exif 3.1): types and counts
# against Tables 17-20, values against the tag definitions in section 4.6.
# "ASCII or UTF-8" in the spec is written as ["ascii", "utf8"].

