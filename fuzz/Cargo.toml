[package]
name = "exifkit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone workspace: cargo-fuzz needs nightly and keeps its own lockfile.
[workspace]
members = ["."]

[dependencies]
exifkit = { path = "..", features = ["png-legacy"] }
libfuzzer-sys = { version = "0.4" }

[[bin]]
name = "write_into"
path = "fuzz_targets/write_into.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_any"
path = "fuzz_targets/read_any.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tiff_parse"
path = "fuzz_targets/tiff_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tiff_header"
path = "fuzz_targets/tiff_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tag_lookup"
path = "fuzz_targets/tag_lookup.rs"
test = false
doc = false
bench = false
