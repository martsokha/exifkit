name: Fuzz

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - write_into
          - roundtrip
          - read_any
          - tiff_parse
          - tiff_header
          - tag_lookup

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-

      # The prebuilt cargo-fuzz is a static musl binary and defaults to the
      # musl target it was built for, which the sanitizers cannot use. Build
      # for the runner's own target instead.
      - name: Run ${{ matrix.target }}
        # A single allocation over 64 MB fails the run: that is how
        # amplification bugs show up. Total RSS keeps libFuzzer's default
        # (2 GB), since AddressSanitizer's quarantine and shadow memory grow
        # with the run, not with exifkit's allocations.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -malloc_limit_mb=64 -max_total_time=600

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
